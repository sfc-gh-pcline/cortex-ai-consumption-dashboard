# created-by: streamlit-in-workspaces; skill-version=1.0.0
definition_version: 2

# Customer example defaults for the Streamlit interface. `make deploy:streamlit` passes
# app_name and app_title explicitly; see "Setup, deployment, and teardown" in README.md.
env:
  app_name: AI_CONSUMPTION_DASHBOARD
  app_title: Cortex AI Consumption Dashboard

entities:
  streamlit_app:
    type: streamlit
    identifier:
      database: COST_MGMT_DB
      schema: PUBLIC
      name: <% ctx.env.app_name %>
    comment: Cortex AI credit, token and call usage by surface, plus cross-surface warehouse compute attribution.
    title: <% ctx.env.app_title %>
    query_warehouse: COMPUTE_WH
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    main_file: streamlit_app.py
    artifacts:
      - pyproject.toml
      - admin_access.toml
      - streamlit_app.py
      - .streamlit/config.toml
      - assets/snowflake-logo.svg
      - assets/snowflake-logo-color-rgb.svg
      - assets/snowflake-logo-reverse-rgb.svg
      - assets/snowflake-bug-color-rgb.svg
      - assets/snowflake-bug-reverse-rgb.svg
      - utils/__init__.py
      - utils/queries.py
      - utils/agg.py
      - utils/date_ranges.py
      - utils/view_state.py
      - utils/ui.py
      - utils/preflight.py
      - utils/snowflake.py
      - utils/config.py
      - utils/admin.py
      - utils/runtime.py
      - app_pages/total_consumption.py
      - app_pages/coco.py
      - app_pages/cowork.py
      - app_pages/cortex_agents.py
      - app_pages/cortex_inference_api.py
      - app_pages/cortex_ai_functions.py
      - app_pages/cortex_search.py
      - app_pages/warehouse_attribution.py
      - app_pages/sql.py
      - app_pages/acceleration_sql.py
      - app_pages/config.py
